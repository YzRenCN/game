
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典扫雷 - Minesweeper</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 自定义样式补充 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none; /* 防止双击选中文本 */
        }

        .game-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 1.5rem;
            max-width: 100%;
        }

        .cell {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
            border-radius: 4px;
            font-size: 16px;
        }

        /* 未揭开的格子 */
        .cell.hidden {
            background-color: #e2e8f0;
            border: 1px solid #cbd5e1;
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.7), inset -2px -2px 5px rgba(0,0,0,0.1);
        }
        .cell.hidden:hover {
            background-color: #cbd5e1;
        }
        .cell.hidden:active {
            transform: scale(0.95);
        }

        /* 已揭开的格子 */
        .cell.revealed {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            cursor: default;
        }

        /* 数字颜色 */
        .num-1 { color: #3b82f6; }
        .num-2 { color: #22c55e; }
        .num-3 { color: #ef4444; }
        .num-4 { color: #a855f7; }
        .num-5 { color: #f97316; }
        .num-6 { color: #06b6d4; }
        .num-7 { color: #000000; }
        .num-8 { color: #64748b; }

        /* 特殊状态 */
        .cell.mine {
            background-color: #fee2e2;
            color: #dc2626;
        }
        .cell.flagged {
            color: #ef4444;
        }
        
        /* 动画 */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 模态框背景 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }
    </style>
</head>
<body class="text-slate-700">

    <!-- 头部导航 -->
    <header class="w-full max-w-4xl mx-auto p-4 flex justify-between items-center mb-4">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-bomb text-3xl text-red-500"></i>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600">Minesweeper Pro</h1>
        </div>
        <button id="settingsBtn" class="p-2 rounded-full hover:bg-white/50 transition-colors">
            <i class="fa-solid fa-gear text-xl"></i>
        </button>
    </header>

    <!-- 游戏主容器 -->
    <main class="game-container flex flex-col items-center gap-6">
        
        <!-- 状态栏 -->
        <div class="flex w-full justify-between items-center bg-slate-100 p-3 rounded-lg shadow-inner">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-flag text-red-500"></i>
                <span id="mineCount" class="font-mono text-xl font-bold">000</span>
            </div>
            
            <button id="resetBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg shadow-md transition-all active:scale-95 flex items-center gap-2">
                <i class="fa-solid fa-face-smile"></i> 新游戏
            </button>

            <div class="flex items-center gap-2">
                <i class="fa-solid fa-clock text-blue-500"></i>
                <span id="timer" class="font-mono text-xl font-bold">000</span>
            </div>
        </div>

        <!-- 难度选择标签 -->
        <div class="flex gap-2 bg-slate-200 p-1 rounded-lg">
            <button class="difficulty-btn px-4 py-1 rounded-md text-sm font-medium transition-all bg-white shadow-sm text-blue-600" data-level="easy">初级</button>
            <button class="difficulty-btn px-4 py-1 rounded-md text-sm font-medium transition-all text-slate-600 hover:bg-white/50" data-level="medium">中级</button>
            <button class="difficulty-btn px-4 py-1 rounded-md text-sm font-medium transition-all text-slate-600 hover:bg-white/50" data-level="hard">高级</button>
        </div>

        <!-- 游戏棋盘区域 -->
        <div id="board" class="grid gap-1 bg-slate-300 p-2 rounded-lg shadow-inner select-none">
            <!-- 动态生成格子 -->
        </div>

        <!-- 操作提示 -->
        <div class="text-xs text-slate-500 flex gap-4">
            <span><i class="fa-solid fa-mouse"></i> 左键揭开</span>
            <span><i class="fa-solid fa-mouse-right"></i> 右键插旗</span>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="mt-8 text-slate-400 text-sm">
        &copy; 2026 Minesweeper Pro. All rights reserved.
    </footer>

    <!-- 游戏结束/胜利 模态框 -->
    <div id="gameModal" class="modal-overlay">
        <div class="modal-content">
            <div id="modalIcon" class="text-6xl mb-4"></div>
            <h2 id="modalTitle" class="text-2xl font-bold mb-2"></h2>
            <p id="modalMessage" class="text-slate-600 mb-6"></p>
            <button id="modalRestartBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full font-bold shadow-lg transition-transform hover:scale-105">
                再玩一次
            </button>
        </div>
    </div>

    <!-- 设置模态框 -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-content w-80">
            <h2 class="text-xl font-bold mb-4">游戏设置</h2>
            <div class="space-y-4 text-left">
                <div class="flex items-center justify-between">
                    <label for="soundToggle" class="text-slate-700">音效</label>
                    <input type="checkbox" id="soundToggle" class="w-5 h-5 accent-blue-600" checked>
                </div>
                <div class="flex items-center justify-between">
                    <label for="themeToggle" class="text-slate-700">深色模式 (开发中)</label>
                    <input type="checkbox" id="themeToggle" class="w-5 h-5 accent-blue-600" disabled>
                </div>
            </div>
            <button id="closeSettingsBtn" class="mt-6 w-full bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded-lg font-medium transition-colors">
                关闭
            </button>
        </div>
    </div>

    <script>
        /**
         * 扫雷游戏核心逻辑
         */
        class Minesweeper {
            constructor() {
                // 配置
                this.levels = {
                    easy: { rows: 9, cols: 9, mines: 10 },
                    medium: { rows: 16, cols: 16, mines: 40 },
                    hard: { rows: 16, cols: 30, mines: 99 }
                };
                this.currentLevel = 'easy';
                this.board = [];
                this.gameState = 'waiting'; // waiting, playing, won, lost
                this.timerInterval = null;
                this.timeElapsed = 0;
                this.flagsPlaced = 0;
                this.soundEnabled = true;

                // DOM 元素
                this.boardEl = document.getElementById('board');
                this.mineCountEl = document.getElementById('mineCount');
                this.timerEl = document.getElementById('timer');
                this.resetBtn = document.getElementById('resetBtn');
                this.difficultyBtns = document.querySelectorAll('.difficulty-btn');
                this.modal = document.getElementById('gameModal');
                this.settingsModal = document.getElementById('settingsModal');
                
                this.init();
            }

            init() {
                this.bindEvents();
                this.startNewGame();
            }

            bindEvents() {
                // 重置按钮
                this.resetBtn.addEventListener('click', () => this.startNewGame());
                document.getElementById('modalRestartBtn').addEventListener('click', () => {
                    this.closeModal();
                    this.startNewGame();
                });

                // 难度切换
                this.difficultyBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        // 更新UI状态
                        this.difficultyBtns.forEach(b => {
                            b.classList.remove('bg-white', 'shadow-sm', 'text-blue-600');
                            b.classList.add('text-slate-600');
                        });
                        e.target.classList.remove('text-slate-600');
                        e.target.classList.add('bg-white', 'shadow-sm', 'text-blue-600');
                        
                        // 设置难度并重启
                        this.currentLevel = e.target.dataset.level;
                        this.startNewGame();
                    });
                });

                // 设置面板
                document.getElementById('settingsBtn').addEventListener('click', () => {
                    this.settingsModal.classList.add('active');
                });
                document.getElementById('closeSettingsBtn').addEventListener('click', () => {
                    this.settingsModal.classList.remove('active');
                });
                document.getElementById('soundToggle').addEventListener('change', (e) => {
                    this.soundEnabled = e.target.checked;
                });

                // 键盘快捷键
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'r' || e.key === 'R') this.startNewGame();
                });
            }

            startNewGame() {
                this.stopTimer();
                this.timeElapsed = 0;
                this.updateTimerDisplay();
                this.gameState = 'waiting';
                this.flagsPlaced = 0;
                this.updateMineCounter();
                this.resetBtn.innerHTML = '<i class="fa-solid fa-face-smile"></i> 新游戏';
                
                const config = this.levels[this.currentLevel];
                this.createBoard(config.rows, config.cols, config.mines);
                this.renderBoard();
            }

            createBoard(rows, cols, mines) {
                this.board = [];
                this.rows = rows;
                this.cols = cols;
                this.totalMines = mines;

                // 初始化空 board
                for (let r = 0; r < rows; r++) {
                    const row = [];
                    for (let c = 0; c < cols; c++) {
                        row.push({
                            r, c,
                            isMine: false,
                            isRevealed: false,
                            isFlagged: false,
                            neighborMines: 0
                        });
                    }
                    this.board.push(row);
                }

                // 随机放置地雷
                let minesPlaced = 0;
                while (minesPlaced < mines) {
                    const r = Math.floor(Math.random() * rows);
                    const c = Math.floor(Math.random() * cols);
                    if (!this.board[r][c].isMine) {
                        this.board[r][c].isMine = true;
                        minesPlaced++;
                    }
                }

                // 计算邻居地雷数
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (!this.board[r][c].isMine) {
                            this.board[r][c].neighborMines = this.countNeighborMines(r, c);
                        }
                    }
                }
            }

            countNeighborMines(r, c) {
                let count = 0;
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        const nr = r + i;
                        const nc = c + j;
                        if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
                            if (this.board[nr][nc].isMine) count++;
                        }
                    }
                }
                return count;
            }

            renderBoard() {
                this.boardEl.innerHTML = '';
                this.boardEl.style.gridTemplateColumns = `repeat(${this.cols}, 30px)`;
                
                const fragment = document.createDocumentFragment();

                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        const cellData = this.board[r][c];
                        const cellEl = document.createElement('div');
                        cellEl.className = 'cell hidden';
                        cellEl.dataset.r = r;
                        cellEl.dataset.c = c;
                        
                        // 事件监听
                        cellEl.addEventListener('click', () => this.handleLeftClick(r, c));
                        cellEl.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            this.handleRightClick(r, c);
                        });

                        fragment.appendChild(cellEl);
                        cellData.element = cellEl; // 引用DOM元素以便更新
                    }
                }
                this.boardEl.appendChild(fragment);
            }

            handleLeftClick(r, c) {
                if (this.gameState === 'won' || this.gameState === 'lost') return;
                const cell = this.board[r][c];
                
                if (cell.isFlagged || cell.isRevealed) return;

                // 第一次点击开始计时
                if (this.gameState === 'waiting') {
                    this.gameState = 'playing';
                    this.startTimer();
                    // 确保第一次点击不是雷 (简单处理：如果是雷，重新生成直到该位置不是雷，或者交换)
                    // 这里为了简化，如果第一下是雷，我们暂时不处理特殊逻辑，或者可以做一个简单的swap
                    if (cell.isMine) {
                        this.swapMine(r, c);
                    }
                }

                this.revealCell(r, c);
                this.checkWinCondition();
            }

            swapMine(r, c) {
                // 找到一个非雷且非当前的格子交换
                for(let i=0; i<this.rows; i++) {
                    for(let j=0; j<this.cols; j++) {
                        if(!this.board[i][j].isMine && !(i===r && j===c)) {
                            this.board[i][j].isMine = true;
                            this.board[r][c].isMine = false;
                            // 重新计算受影响区域的邻居数 (简化：全部重算)
                            for(let x=0; x<this.rows; x++) {
                                for(let y=0; y<this.cols; y++) {
                                    if(!this.board[x][y].isMine) {
                                        this.board[x][y].neighborMines = this.countNeighborMines(x, y);
                                    }
                                }
                            }
                            return;
                        }
                    }
                }
            }

            handleRightClick(r, c) {
                if (this.gameState === 'won' || this.gameState === 'lost') return;
                if (this.gameState === 'waiting') return; // 必须先左键开始

                const cell = this.board[r][c];
                if (cell.isRevealed) return;

                if (cell.isFlagged) {
                    cell.isFlagged = false;
                    cell.element.classList.remove('flagged');
                    cell.element.innerHTML = '';
                    this.flagsPlaced--;
                } else {
                    cell.isFlagged = true;
                    cell.element.classList.add('flagged');
                    cell.element.innerHTML = '<i class="fa-solid fa-flag animate-pop"></i>';
                    this.flagsPlaced++;
                    // 播放音效
                    if(this.soundEnabled) this.playSound('flag');
                }
                this.updateMineCounter();
            }

            revealCell(r, c) {
                const cell = this.board[r][c];
                if (cell.isRevealed || cell.isFlagged) return;

                cell.isRevealed = true;
                cell.element.classList.remove('hidden');
                cell.element.classList.add('revealed');

                if (cell.isMine) {
                    this.gameOver(false);
                    cell.element.classList.add('mine');
                    cell.element.innerHTML = '<i class="fa-solid fa-bomb animate-pop"></i>';
                    if(this.soundEnabled) this.playSound('explode');
                    return;
                }

                if (cell.neighborMines > 0) {
                    cell.element.textContent = cell.neighborMines;
                    cell.element.classList.add(`num-${cell.neighborMines}`);
                    if(this.soundEnabled) this.playSound('click');
                } else {
                    // 空白格，递归展开
                    if(this.soundEnabled) this.playSound('click');
                    for (let i = -1; i <= 1; i++) {
                        for (let j = -1; j <= 1; j++) {
                            const nr = r + i;
                            const nc = c + j;
                            if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
                                this.revealCell(nr, nc);
                            }
                        }
                    }
                }
            }

            checkWinCondition() {
                if (this.gameState !== 'playing') return;

                let revealedCount = 0;
                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        if (this.board[r][c].isRevealed) revealedCount++;
                    }
                }

                const totalCells = this.rows * this.cols;
                if (revealedCount === totalCells - this.totalMines) {
                    this.gameOver(true);
                }
            }

            gameOver(isWin) {
                this.stopTimer();
                this.gameState = isWin ? 'won' : 'lost';
                
                if (isWin) {
                    this.resetBtn.innerHTML = '<i class="fa-solid fa-face-laugh-beam"></i> 胜利!';
                    this.showModal('胜利!', `用时: ${this.timeElapsed} 秒`, 'fa-trophy text-yellow-500');
                    if(this.soundEnabled) this.playSound('win');
                } else {
                    this.resetBtn.innerHTML = '<i class="fa-solid fa-face-dizzy"></i> 失败';
                    this.revealAllMines();
                    this.showModal('游戏结束', '踩到地雷了！', 'fa-skull-crossbones text-gray-700');
                }
            }

            revealAllMines() {
                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        const cell = this.board[r][c];
                        if (cell.isMine && !cell.isRevealed) {
                            cell.element.classList.remove('hidden');
                            cell.element.classList.add('revealed', 'mine');
                            cell.element.innerHTML = '<i class="fa-solid fa-bomb"></i>';
                        } else if (!cell.isMine && cell.isFlagged) {
                            // 标错旗
                            cell.element.classList.add('bg-red-100');
                            cell.element.innerHTML = '<i class="fa-solid fa-xmark text-red-600"></i>';
                        }
                    }
                }
            }

            startTimer() {
                this.timerInterval = setInterval(() => {
                    this.timeElapsed++;
                    this.updateTimerDisplay();
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            updateTimerDisplay() {
                this.timerEl.textContent = this.timeElapsed.toString().padStart(3, '0');
            }

            updateMineCounter() {
                const remaining = this.totalMines - this.flagsPlaced;
                this.mineCountEl.textContent = remaining.toString().padStart(3, '0');
            }

            showModal(title, message, iconClass) {
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalMessage').textContent = message;
                document.getElementById('modalIcon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
                this.modal.classList.add('active');
            }

            closeModal() {
                this.modal.classList.remove('active');
            }

            playSound(type) {
                // 简单的音频模拟，实际项目中应使用 Audio 对象加载文件
                // 这里仅作为逻辑占位，因为要求不依赖外部资源文件，且Base64太长
                // 如果需要真实声音，可以使用 Web Audio API 生成振荡器声音
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return;
                    
                    const ctx = new AudioContext();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    if (type === 'click') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(800, ctx.currentTime);
                        gain.gain.setValueAtTime(0.1, ctx.currentTime);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.05);
                    } else if (type === 'flag') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(400, ctx.currentTime);
                        gain.gain.setValueAtTime(0.1, ctx.currentTime);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.1);
                    } else if (type === 'explode') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(100, ctx.currentTime);
                        gain.gain.setValueAtTime(0.3, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.3);
                    } else if (type === 'win') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(400, ctx.currentTime);
                        osc.frequency.linearRampToValueAtTime(800, ctx.currentTime + 0.2);
                        gain.gain.setValueAtTime(0.1, ctx.currentTime);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.4);
                    }
                } catch (e) {
                    console.error("Audio play failed", e);
                }
            }
        }

        // 启动游戏
        document.addEventListener('DOMContentLoaded', () => {
            new Minesweeper();
        });
    </script>
</body>
</html>
