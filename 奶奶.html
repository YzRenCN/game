<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏚️ 恐怖老奶奶 · 自动漫游</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', Arial, sans-serif;
            cursor: default;
        }
        canvas {
            display: block;
        }

        /* UI 叠加层 */
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            background: rgba(0, 0, 0, 0.55);
            padding: 10px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 20px;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 0.5px;
        }
        #hud .item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #hud .item .icon {
            font-size: 22px;
        }
        #hud .item .count {
            font-size: 20px;
            min-width: 28px;
            text-align: center;
            color: #ffd700;
        }
        #hud .status {
            color: #aaa;
            font-size: 14px;
            font-weight: 400;
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            padding-left: 18px;
            min-width: 120px;
        }

        #message {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 20px;
            font-weight: 500;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
            text-align: center;
            max-width: 80%;
            z-index: 10;
        }
        #message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #message.danger {
            color: #ff6b6b;
            border-color: rgba(255, 80, 80, 0.4);
        }
        #message.success {
            color: #69db7c;
            border-color: rgba(80, 255, 80, 0.3);
        }

        #danger-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(255, 0, 0, 0) 80%);
            transition: background 0.3s ease;
            opacity: 0;
        }
        #danger-vignette.active {
            opacity: 1;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(180, 0, 0, 0.35) 80%);
        }
        #danger-vignette.caught {
            opacity: 1;
            background: radial-gradient(ellipse at center, transparent 10%, rgba(200, 0, 0, 0.8) 90%);
            transition: background 0.1s;
        }

        #heartbeat {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(180, 0, 0, 0.08) 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        #heartbeat.pulse {
            animation: pulse-red 0.6s ease-in-out infinite alternate;
        }
        @keyframes pulse-red {
            0% {
                opacity: 0.2;
            }
            100% {
                opacity: 0.7;
            }
        }

        #overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
            pointer-events: auto;
            transition: opacity 0.8s ease;
        }
        #overlay-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #overlay-screen h1 {
            font-size: 56px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 60px rgba(255, 0, 0, 0.5), 0 0 120px rgba(200, 0, 0, 0.2);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }
        #overlay-screen .sub {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 30px;
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
        }
        #overlay-screen .sub strong {
            color: #ff6b6b;
        }
        #overlay-screen .btn {
            padding: 16px 48px;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 30px rgba(200, 0, 0, 0.3);
            letter-spacing: 1px;
        }
        #overlay-screen .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(200, 0, 0, 0.5);
        }
        #overlay-screen .btn:active {
            transform: scale(0.95);
        }
        #overlay-screen .result-icon {
            font-size: 72px;
            margin-bottom: 10px;
        }
        #overlay-screen .result-detail {
            color: #888;
            font-size: 16px;
            margin-top: 8px;
        }

        @media (max-width: 600px) {
            #hud {
                font-size: 14px;
                padding: 6px 16px;
                gap: 10px;
                top: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }
            #hud .status {
                font-size: 12px;
                padding-left: 10px;
                min-width: 80px;
            }
            #overlay-screen h1 {
                font-size: 36px;
            }
            #overlay-screen .sub {
                font-size: 16px;
                padding: 0 20px;
            }
            #overlay-screen .btn {
                padding: 12px 32px;
                font-size: 16px;
            }
            #message {
                font-size: 16px;
                padding: 10px 20px;
                bottom: 70px;
                max-width: 90%;
            }
        }
    </style>
</head>
<body>

    <!-- UI 层 -->
    <div id="ui">
        <div id="hud">
            <span class="item">
                <span class="icon">🔑</span>
                <span class="count" id="key-count">0</span>
                <span style="color:#666;font-weight:300;">/ 3</span>
            </span>
            <span class="status" id="hud-status">🚶 自动漫游中...</span>
        </div>
        <div id="message"></div>
        <div id="danger-vignette"></div>
        <div id="heartbeat"></div>
    </div>

    <!-- 开始/结束画面 -->
    <div id="overlay-screen">
        <div class="result-icon" id="result-icon">🏚️</div>
        <h1 id="title-text">恐怖老奶奶</h1>
        <div class="sub" id="sub-text">
            你被困在阴森的宅邸中，<br />
            相机将自动带你探索。<br />
            收集 <strong>3 把钥匙</strong> 逃出，小心老奶奶！
        </div>
        <button class="btn" id="main-btn">开始漫游</button>
        <div class="result-detail" id="result-detail"></div>
    </div>

    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        //  导入
        // ============================================================
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============================================================
        //  DOM 引用
        // ============================================================
        const overlayScreen = document.getElementById('overlay-screen');
        const titleText = document.getElementById('title-text');
        const subText = document.getElementById('sub-text');
        const resultIcon = document.getElementById('result-icon');
        const mainBtn = document.getElementById('main-btn');
        const resultDetail = document.getElementById('result-detail');
        const keyCountEl = document.getElementById('key-count');
        const hudStatus = document.getElementById('hud-status');
        const messageEl = document.getElementById('message');
        const dangerVignette = document.getElementById('danger-vignette');
        const heartbeatEl = document.getElementById('heartbeat');

        // ============================================================
        //  游戏状态
        // ============================================================
        let isPlaying = false;
        let isGameOver = false;
        let keysCollected = 0;
        const MAX_KEYS = 3;
        let gameTime = 0;
        let grannyAlertLevel = 0;
        let pathProgress = 0; // 0-1 沿路径
        let pathPoints = [];
        let currentPathIndex = 0;
        let cameraTarget = new THREE.Vector3();
        let cameraLookTarget = new THREE.Vector3();

        // ============================================================
        //  Three.js 场景
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.Fog(0x0a0a0a, 18, 40);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 60);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.prepend(renderer.domElement);

        // ============================================================
        //  灯光
        // ============================================================
        const ambientLight = new THREE.AmbientLight(0x222244, 0.15);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0x4466aa, 0.5);
        moonLight.position.set(-15, 25, 10);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 1024;
        moonLight.shadow.mapSize.height = 1024;
        moonLight.shadow.camera.near = 0.5;
        moonLight.shadow.camera.far = 60;
        moonLight.shadow.camera.left = -25;
        moonLight.shadow.camera.right = 25;
        moonLight.shadow.camera.top = 25;
        moonLight.shadow.camera.bottom = -25;
        scene.add(moonLight);

        const flickerLight = new THREE.PointLight(0xff6633, 0.8, 20);
        flickerLight.position.set(5, 3.5, -5);
        scene.add(flickerLight);

        const flickerLight2 = new THREE.PointLight(0x3366ff, 0.3, 15);
        flickerLight2.position.set(-6, 3, 8);
        scene.add(flickerLight2);

        // ============================================================
        //  场景构建 (与之前类似，但增加更多细节)
        // ============================================================
        const ROOM_SIZE = 38;
        const WALL_HEIGHT = 4.5;
        const FLOOR_Y = 0;

        // 地面
        const floorGeo = new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x2a1f1a,
            roughness: 0.9,
            metalness: 0.0,
            side: THREE.DoubleSide,
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = FLOOR_Y;
        floor.receiveShadow = true;
        scene.add(floor);

        // 网格线（增加细节）
        const gridHelper = new THREE.GridHelper(ROOM_SIZE, 20, 0x44332a, 0x33221a);
        gridHelper.position.y = FLOOR_Y + 0.02;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.2;
        scene.add(gridHelper);

        // 墙壁
        function createWall(w, h, posX, posY, posZ, rotY = 0, color = 0x3d2e26) {
            const geo = new THREE.BoxGeometry(w, h, 0.3);
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.0 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(posX, posY + h / 2, posZ);
            mesh.rotation.y = rotY;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        const wallColor = 0x3d2e26;
        const wallColorDark = 0x2d1f18;
        const half = ROOM_SIZE / 2;

        createWall(ROOM_SIZE, WALL_HEIGHT, 0, 0, -half, 0, wallColor);
        createWall(ROOM_SIZE, WALL_HEIGHT, 0, 0, half, 0, wallColor);
        createWall(ROOM_SIZE, WALL_HEIGHT, -half, 0, 0, 0, wallColor);
        createWall(ROOM_SIZE, WALL_HEIGHT, half, 0, 0, 0, wallColor);

        // 天花板
        const ceilMat = new THREE.MeshStandardMaterial({
            color: 0x1a1410,
            roughness: 1,
            metalness: 0,
            transparent: true,
            opacity: 0.5,
            side: THREE.DoubleSide,
        });
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_SIZE - 0.5, ROOM_SIZE - 0.5), ceilMat);
        ceil.rotation.x = Math.PI / 2;
        ceil.position.y = WALL_HEIGHT;
        scene.add(ceil);

        // 内部隔断
        createWall(16, WALL_HEIGHT, -4, 0, 0, 0, wallColorDark);
        createWall(10, WALL_HEIGHT, 4, 0, 5, 0, wallColorDark);
        createWall(10, WALL_HEIGHT, -4, 0, -5, 0, wallColorDark);

        // 柱子
        function createPillar(x, z) {
            const geo = new THREE.CylinderGeometry(0.4, 0.5, WALL_HEIGHT, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0x4a3a30, roughness: 0.9 });
            const p = new THREE.Mesh(geo, mat);
            p.position.set(x, WALL_HEIGHT / 2, z);
            p.castShadow = true;
            p.receiveShadow = true;
            scene.add(p);
            return p;
        }
        const pillarPositions = [
            [-8, -8],
            [-8, 8],
            [8, -8],
            [8, 8],
            [-12, 0],
            [12, 0],
            [0, -12],
            [0, 12]
        ];
        pillarPositions.forEach(([x, z]) => createPillar(x, z));

        // 更多家具
        function createTable(x, z, rot = 0) {
            const group = new THREE.Group();
            const top = new THREE.Mesh(
                new THREE.BoxGeometry(1.8, 0.15, 1.2),
                new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 0.8 })
            );
            top.position.y = 0.8;
            top.castShadow = true;
            top.receiveShadow = true;
            group.add(top);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x3d2e26, roughness: 0.9 });
            const legPos = [
                [-0.7, -0.4],
                [0.7, -0.4],
                [-0.7, 0.4],
                [0.7, 0.4]
            ];
            legPos.forEach(([lx, lz]) => {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.7, 6), legMat);
                leg.position.set(lx, 0.35, lz);
                leg.castShadow = true;
                group.add(leg);
            });
            group.position.set(x, FLOOR_Y, z);
            group.rotation.y = rot;
            scene.add(group);
            return group;
        }
        createTable(-6, -6, 0.3);
        createTable(7, 5, -0.5);
        createTable(-7, 8, 0.8);
        createTable(9, -7, 1.2);

        function createCabinet(x, z, rot = 0) {
            const g = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.6, 0.6),
                new THREE.MeshStandardMaterial({ color: 0x4a3528, roughness: 0.9 })
            );
            body.position.y = 0.8;
            body.castShadow = true;
            body.receiveShadow = true;
            g.add(body);
            const handle = new THREE.Mesh(
                new THREE.SphereGeometry(0.06, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0xccaa66, metalness: 0.6, roughness: 0.3 })
            );
            handle.position.set(0.4, 0.8, 0.35);
            g.add(handle);
            g.position.set(x, FLOOR_Y, z);
            g.rotation.y = rot;
            scene.add(g);
            return g;
        }
        createCabinet(-10, -4, 0.2);
        createCabinet(10, 4, -0.3);
        createCabinet(-3, 12, 0.5);

        // 挂画 (增加细节)
        function createPainting(x, y, z, rotY = 0, color = 0x8a6a4a) {
            const frame = new THREE.Mesh(
                new THREE.BoxGeometry(1.0, 0.8, 0.05),
                new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 0.7 })
            );
            frame.position.set(x, y, z);
            frame.rotation.y = rotY;
            frame.castShadow = true;
            scene.add(frame);
            const pic = new THREE.Mesh(
                new THREE.PlaneGeometry(0.8, 0.6),
                new THREE.MeshStandardMaterial({ color, roughness: 0.9 })
            );
            pic.position.set(x, y, z + (rotY === 0 ? 0.035 : 0));
            pic.rotation.y = rotY;
            scene.add(pic);
            return frame;
        }
        createPainting(-half + 0.5, 2.2, -2, 0, 0x6a4a3a);
        createPainting(half - 0.5, 2.2, 3, Math.PI, 0x8a5a4a);
        createPainting(2, 2.2, half - 0.5, Math.PI / 2, 0x4a6a8a);

        // 地毯 (平面)
        const carpetMat = new THREE.MeshStandardMaterial({
            color: 0x4a2a2a,
            roughness: 0.95,
            transparent: true,
            opacity: 0.6,
        });
        const carpet = new THREE.Mesh(new THREE.PlaneGeometry(4, 3), carpetMat);
        carpet.rotation.x = -Math.PI / 2;
        carpet.position.set(-3, FLOOR_Y + 0.01, -2);
        carpet.receiveShadow = true;
        scene.add(carpet);

        // 烛台 (装饰)
        function createCandle(x, z) {
            const group = new THREE.Group();
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(0.12, 0.15, 0.06, 8),
                new THREE.MeshStandardMaterial({ color: 0xccaa88, metalness: 0.3, roughness: 0.5 })
            );
            base.position.y = 0.03;
            group.add(base);
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.04, 0.05, 0.2, 8),
                new THREE.MeshStandardMaterial({ color: 0xffeedd, emissive: 0xff8800, emissiveIntensity: 0.1 })
            );
            body.position.y = 0.16;
            group.add(body);
            const flame = new THREE.Mesh(
                new THREE.SphereGeometry(0.03, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: 0xff4400, emissiveIntensity: 0.8 })
            );
            flame.position.y = 0.28;
            group.add(flame);
            group.position.set(x, FLOOR_Y, z);
            scene.add(group);
            return group;
        }
        createCandle(5, 6);
        createCandle(-5, -7);

        // 出口门 (在Z正方向)
        const doorGroup = new THREE.Group();
        const doorFrame = new THREE.Mesh(
            new THREE.BoxGeometry(2.2, 3.2, 0.4),
            new THREE.MeshStandardMaterial({ color: 0x2a1f1a, roughness: 0.9 })
        );
        doorFrame.position.y = 1.6;
        doorFrame.castShadow = true;
        doorGroup.add(doorFrame);

        const doorMat = new THREE.MeshStandardMaterial({
            color: 0x5a3d2e,
            roughness: 0.7,
            metalness: 0.1,
        });
        const doorPanel = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.8, 0.08), doorMat);
        doorPanel.position.set(0, 1.6, 0.22);
        doorPanel.castShadow = true;
        doorGroup.add(doorPanel);

        const glowMat = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            emissive: 0xffd700,
            emissiveIntensity: 0,
            transparent: true,
            opacity: 0.3,
            side: THREE.DoubleSide,
        });
        const glowFrame = new THREE.Mesh(new THREE.BoxGeometry(2.4, 3.4, 0.1), glowMat);
        glowFrame.position.set(0, 1.6, 0.28);
        doorGroup.add(glowFrame);

        doorGroup.position.set(0, FLOOR_Y, half - 0.5);
        scene.add(doorGroup);

        // 保存引用
        const doorGlow = glowFrame;
        const doorPanelMesh = doorPanel;

        // ============================================================
        //  钥匙 (收集品)
        // ============================================================
        const keyPositions = [
            [-9, 1.2, -7],
            [7, 1.2, 8],
            [-5, 1.2, 11],
        ];
        const keys = [];

        function createKey(x, y, z) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.TorusGeometry(0.3, 0.08, 8, 12),
                new THREE.MeshStandardMaterial({
                    color: 0xffd700,
                    metalness: 0.8,
                    roughness: 0.2,
                    emissive: 0xffaa00,
                    emissiveIntensity: 0.15,
                })
            );
            body.rotation.x = Math.PI / 2;
            body.position.y = 0;
            group.add(body);
            const stem = new THREE.Mesh(
                new THREE.BoxGeometry(0.08, 0.35, 0.08),
                new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 })
            );
            stem.position.set(0, 0.25, 0);
            group.add(stem);
            const glow = new THREE.Mesh(
                new THREE.SphereGeometry(0.5, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.08 })
            );
            group.add(glow);
            group.position.set(x, y, z);
            group.userData = {
                collected: false,
                glow: glow,
                floatPhase: Math.random() * Math.PI * 2,
                rotSpeed: 0.8 + Math.random() * 0.6,
            };
            scene.add(group);
            return group;
        }
        keyPositions.forEach(([x, y, z]) => {
            const key = createKey(x, y, z);
            keys.push(key);
        });

        // ============================================================
        //  老奶奶角色
        // ============================================================
        const granny = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.9, metalness: 0 });
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 1.2, 8), bodyMat);
        torso.position.y = 0.6;
        torso.castShadow = true;
        granny.add(torso);

        const upperMat = new THREE.MeshStandardMaterial({ color: 0x2d1f18, roughness: 0.9 });
        const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.7, 0.7, 8), upperMat);
        upper.position.y = 1.3;
        upper.castShadow = true;
        granny.add(upper);

        const headMat = new THREE.MeshStandardMaterial({ color: 0xd4b8a8, roughness: 0.6 });
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), headMat);
        head.position.y = 1.8;
        head.castShadow = true;
        granny.add(head);

        const hairMat = new THREE.MeshStandardMaterial({ color: 0x8a8a8a, roughness: 0.9 });
        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.42, 8, 8), hairMat);
        hair.position.y = 1.9;
        hair.scale.set(1, 0.6, 1.1);
        granny.add(hair);

        const eyeMat = new THREE.MeshStandardMaterial({
            color: 0xff2200,
            emissive: 0xff0000,
            emissiveIntensity: 0.6,
        });
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
        eyeL.position.set(-0.15, 1.85, 0.35);
        granny.add(eyeL);
        const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
        eyeR.position.set(0.15, 1.85, 0.35);
        granny.add(eyeR);

        const apronMat = new THREE.MeshStandardMaterial({ color: 0x3d2e26, roughness: 0.9 });
        const apron = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.75, 0.6, 8), apronMat);
        apron.position.y = 0.5;
        apron.scale.set(1, 1, 1.3);
        granny.add(apron);

        const armMat = new THREE.MeshStandardMaterial({ color: 0xd4b8a8, roughness: 0.7 });
        const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.7, 6), armMat);
        armL.position.set(-0.7, 1.2, 0);
        armL.rotation.z = 0.2;
        armL.rotation.x = -0.3;
        granny.add(armL);

        const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.7, 6), armMat);
        armR.position.set(0.7, 1.2, 0);
        armR.rotation.z = -0.2;
        armR.rotation.x = 0.3;
        granny.add(armR);

        granny.position.set(-12, FLOOR_Y, -10);
        granny.scale.set(1, 1, 1);
        scene.add(granny);

        // 老奶奶AI (与之前相同，用于追逐)
        const grannyState = {
            targetX: -12,
            targetZ: -10,
            speed: 0.8,
            state: 'patrol', // patrol | chase
            chaseTimer: 0,
            alertCooldown: 0,
            lastKnownPlayerX: 0,
            lastKnownPlayerZ: 0,
            nextPatrolTime: 0,
        };

        // ============================================================
        //  碰撞检测 (与之前相同)
        // ============================================================
        const walls = [];

        function collectWalls() {
            const obstacles = [
                [-18, -2, -10, 2],
                [-2, -2, 6, 2],
                [-2, -18, 2, -8],
                [-2, 8, 2, 18],
                [-8.5, -8.5, -7.5, -7.5],
                [-8.5, 7.5, -7.5, 8.5],
                [7.5, -8.5, 8.5, -7.5],
                [7.5, 7.5, 8.5, 8.5],
                [-12.5, -0.5, -11.5, 0.5],
                [11.5, -0.5, 12.5, 0.5],
                [-0.5, -12.5, 0.5, -11.5],
                [-0.5, 11.5, 0.5, 12.5],
            ];
            obstacles.forEach(([x1, z1, x2, z2]) => {
                walls.push({
                    xMin: Math.min(x1, x2),
                    xMax: Math.max(x1, x2),
                    zMin: Math.min(z1, z2),
                    zMax: Math.max(z1, z2),
                });
            });
            const margin = 0.8;
            const half = ROOM_SIZE / 2 - margin;
            walls.push({
                xMin: -half,
                xMax: half,
                zMin: -half,
                zMax: half,
                isBoundary: true,
            });
        }
        collectWalls();

        function checkCollision(x, z, radius = 0.5) {
            for (const wall of walls) {
                if (wall.isBoundary) {
                    if (x < wall.xMin + radius || x > wall.xMax - radius ||
                        z < wall.zMin + radius || z > wall.zMax - radius) {
                        return true;
                    }
                    continue;
                }
                const cx = Math.max(wall.xMin, Math.min(x, wall.xMax));
                const cz = Math.max(wall.zMin, Math.min(z, wall.zMax));
                const dx = x - cx;
                const dz = z - cz;
                if (dx * dx + dz * dz < radius * radius) {
                    return true;
                }
            }
            return false;
        }

        function tryMove(x, z, radius = 0.45) {
            if (!checkCollision(x, z, radius)) {
                return { x, z, ok: true };
            }
            if (!checkCollision(x, granny.position.z, radius)) {
                return { x, z: granny.position.z, ok: true };
            }
            if (!checkCollision(granny.position.x, z, radius)) {
                return { x: granny.position.x, z, ok: true };
            }
            const step = 0.05;
            for (let dx of [-step, step]) {
                for (let dz of [-step, step]) {
                    const nx = granny.position.x + dx;
                    const nz = granny.position.z + dz;
                    if (!checkCollision(nx, nz, radius)) {
                        return { x: nx, z: nz, ok: true };
                    }
                }
            }
            return { x: granny.position.x, z: granny.position.z, ok: false };
        }

        // ============================================================
        //  音效 (Web Audio)
        // ============================================================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, duration, type = 'sine', volume = 0.15) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) { /* 静默 */ }
        }

        function playPickup() {
            playTone(880, 0.15, 'sine', 0.2);
            setTimeout(() => playTone(1100, 0.15, 'sine', 0.15), 100);
        }

        function playCaught() {
            playTone(200, 0.8, 'sawtooth', 0.25);
            setTimeout(() => playTone(150, 0.6, 'sawtooth', 0.2), 200);
        }

        function playWin() {
            [523, 659, 784, 1047].forEach((f, i) => {
                setTimeout(() => playTone(f, 0.2, 'sine', 0.15), i * 120);
            });
        }

        function playHeartbeat() {
            playTone(40, 0.1, 'sine', 0.3);
            setTimeout(() => playTone(35, 0.1, 'sine', 0.2), 120);
        }

        // ============================================================
        //  自动漫游路径
        // ============================================================
        function buildPath() {
            // 定义一系列路径点 (x, z)，相机将沿此行走
            const points = [
                { x: 0, z: -10 },
                { x: -6, z: -6 },
                { x: -10, z: -4 },
                { x: -8, z: 2 },
                { x: -4, z: 6 },
                { x: 0, z: 8 },
                { x: 5, z: 6 },
                { x: 9, z: 2 },
                { x: 8, z: -3 },
                { x: 4, z: -7 },
                { x: 0, z: -5 },
                { x: -2, z: 0 },
                { x: 2, z: 4 },
                { x: 0, z: half - 1.5 }, // 出口
            ];
            // 转换为Vector3，并设置高度为1.6
            return points.map(p => new THREE.Vector3(p.x, 1.6, p.z));
        }

        let path = buildPath();
        let pathIndex = 0; // 当前段
        let pathT = 0; // 0-1 段内进度

        // ============================================================
        //  UI 函数
        // ============================================================
        let messageTimeout = null;

        function showMessage(text, type = '', duration = 2500) {
            messageEl.textContent = text;
            messageEl.className = 'show' + (type ? ' ' + type : '');
            clearTimeout(messageTimeout);
            messageTimeout = setTimeout(() => {
                messageEl.className = '';
            }, duration);
        }

        function updateHUD() {
            keyCountEl.textContent = keysCollected;
            if (keysCollected === MAX_KEYS) {
                hudStatus.textContent = '🚪 找到出口！';
                hudStatus.style.color = '#ffd700';
            } else {
                hudStatus.textContent = `🔍 收集钥匙 (${keysCollected}/${MAX_KEYS})`;
                hudStatus.style.color = '#aaa';
            }
        }

        function collectKey(index) {
            if (keys[index].userData.collected) return;
            keys[index].userData.collected = true;
            keysCollected++;
            playPickup();
            showMessage(`🔑 找到钥匙！ (${keysCollected}/${MAX_KEYS})`, 'success', 1500);
            updateHUD();
            const key = keys[index];
            key.visible = false;
            if (keysCollected === MAX_KEYS) {
                showMessage('🚪 所有钥匙已收集！快逃向出口！', 'success', 3000);
                doorGlow.material.emissiveIntensity = 1.2;
                doorGlow.material.opacity = 0.7;
                doorPanelMesh.material.color.setHex(0x8a6a4a);
                doorPanelMesh.position.x = 0.5;
                doorPanelMesh.rotation.y = -0.4;
                setTimeout(() => playWin(), 500);
            }
        }

        function gameOver(caught = true) {
            if (isGameOver) return;
            isGameOver = true;
            isPlaying = false;
            if (caught) {
                playCaught();
                dangerVignette.className = 'caught';
                showMessage('💀 老奶奶抓住了你...', 'danger', 3000);
                setTimeout(() => {
                    showEndScreen(false);
                }, 1200);
            } else {
                playWin();
                showMessage('🎉 你成功逃出了宅邸！', 'success', 4000);
                setTimeout(() => {
                    showEndScreen(true);
                }, 1500);
            }
        }

        function showEndScreen(win) {
            overlayScreen.classList.remove('hidden');
            resultIcon.textContent = win ? '🎉' : '💀';
            titleText.textContent = win ? '你逃出来了！' : '被抓住了...';
            subText.innerHTML = win ?
                '你成功收集了所有钥匙，逃离了恐怖老奶奶的魔掌！<br />🏆 恭喜通关！' :
                '老奶奶在黑暗中抓住了你...<br />下次要更小心，跑得更快！';
            mainBtn.textContent = win ? '🔄 再玩一次' : '🔄 重新挑战';
            resultDetail.textContent = win ?
                `⏱️ 用时 ${Math.floor(gameTime)} 秒 · 收集 ${keysCollected} 把钥匙` :
                `⏱️ 存活 ${Math.floor(gameTime)} 秒 · 收集 ${keysCollected} 把钥匙`;
            mainBtn.className = 'btn' + (win ? '' : ' btn-secondary');
            mainBtn.onclick = restartGame;
        }

        function restartGame() {
            // 重置状态
            keysCollected = 0;
            isGameOver = false;
            isPlaying = true;
            grannyAlertLevel = 0;
            gameTime = 0;
            pathIndex = 0;
            pathT = 0;
            // 重置相机
            const start = path[0];
            if (start) {
                camera.position.copy(start);
                camera.lookAt(path[1] || start);
            }

            // 重置钥匙
            keys.forEach((key, i) => {
                key.userData.collected = false;
                key.visible = true;
                key.position.set(keyPositions[i][0], keyPositions[i][1], keyPositions[i][2]);
                key.userData.floatPhase = Math.random() * Math.PI * 2;
            });

            // 重置门
            doorGlow.material.emissiveIntensity = 0;
            doorGlow.material.opacity = 0.3;
            doorPanelMesh.material.color.setHex(0x5a3d2e);
            doorPanelMesh.position.x = 0;
            doorPanelMesh.rotation.y = 0;

            // 重置老奶奶
            granny.position.set(-12, FLOOR_Y, -10);
            grannyState.targetX = -12;
            grannyState.targetZ = -10;
            grannyState.state = 'patrol';
            grannyState.chaseTimer = 0;
            grannyState.alertCooldown = 0;

            // 重置UI
            dangerVignette.className = '';
            heartbeatEl.className = '';
            heartbeatEl.style.opacity = '0';
            updateHUD();
            showMessage('🚶 自动漫游开始...', '', 2000);

            overlayScreen.classList.add('hidden');
        }

        // ============================================================
        //  更新逻辑
        // ============================================================
        function updatePath(delta) {
            if (!isPlaying || isGameOver) return;

            const speed = 1.2; // 移动速度
            const step = speed * delta;

            // 当前段
            const p0 = path[pathIndex];
            const p1 = path[(pathIndex + 1) % path.length];
            if (!p0 || !p1) return;

            const dir = new THREE.Vector3().copy(p1).sub(p0);
            const dist = dir.length();
            if (dist < 0.01) {
                pathIndex = (pathIndex + 1) % path.length;
                return;
            }

            // 前进
            pathT += step / dist;
            if (pathT >= 1) {
                pathT = 0;
                pathIndex = (pathIndex + 1) % path.length;
                // 检查是否到达出口 (最后一个点)
                if (pathIndex === path.length - 1 && keysCollected === MAX_KEYS) {
                    // 到达出口胜利
                    gameOver(false);
                    return;
                }
                if (pathIndex === path.length - 1 && keysCollected < MAX_KEYS) {
                    // 到达出口但未收集完，转向
                    showMessage('🔑 需要集齐所有钥匙！', 'danger', 1500);
                    // 反向走
                    pathIndex = Math.max(0, pathIndex - 1);
                }
            }

            // 插值位置
            const pos = new THREE.Vector3().lerpVectors(p0, p1, pathT);
            camera.position.copy(pos);

            // 看向前方
            const lookAhead = Math.min(pathT + 0.15, 1);
            const lookPos = new THREE.Vector3().lerpVectors(p0, p1, lookAhead);
            if (pathIndex + 1 < path.length) {
                const nextP = path[pathIndex + 1];
                const mid = new THREE.Vector3().lerpVectors(p1, nextP, 0.3);
                camera.lookAt(mid);
            } else {
                camera.lookAt(p1);
            }

            // 检查是否靠近钥匙
            keys.forEach((key, i) => {
                if (key.userData.collected) return;
                const dx = camera.position.x - key.position.x;
                const dz = camera.position.z - key.position.z;
                if (dx * dx + dz * dz < 1.5) {
                    collectKey(i);
                }
            });

            // 更新老奶奶AI (追逐相机)
            updateGranny(delta);
        }

        function updateGranny(delta) {
            if (!isPlaying || isGameOver) return;

            const gx = granny.position.x;
            const gz = granny.position.z;
            const px = camera.position.x;
            const pz = camera.position.z;

            const dx = px - gx;
            const dz = pz - gz;
            const dist = Math.sqrt(dx * dx + dz * dz);

            // 警报等级
            if (dist < 12) {
                grannyAlertLevel = Math.min(1, grannyAlertLevel + delta * 0.2);
                if (dist < 8 && !isGameOver) {
                    heartbeatEl.className = 'pulse';
                    heartbeatEl.style.opacity = '1';
                    if (Math.random() < 0.02) playHeartbeat();
                } else {
                    heartbeatEl.className = '';
                    heartbeatEl.style.opacity = '0';
                }
                if (dist < 6) {
                    dangerVignette.className = 'active';
                    const intensity = 1 - (dist / 6);
                    dangerVignette.style.opacity = intensity * 0.6 + 0.2;
                } else {
                    dangerVignette.className = '';
                    dangerVignette.style.opacity = '0';
                }
            } else {
                grannyAlertLevel = Math.max(0, grannyAlertLevel - delta * 0.1);
                if (grannyAlertLevel < 0.1) {
                    heartbeatEl.className = '';
                    heartbeatEl.style.opacity = '0';
                    dangerVignette.className = '';
                    dangerVignette.style.opacity = '0';
                }
            }

            // 状态切换
            const patrolSpeed = 0.7;
            const chaseSpeed = 2.0 + grannyAlertLevel * 0.5;

            if (dist < 7 && grannyAlertLevel > 0.3) {
                grannyState.state = 'chase';
                grannyState.lastKnownPlayerX = px;
                grannyState.lastKnownPlayerZ = pz;
                grannyState.chaseTimer = 0;
            } else if (grannyState.state === 'chase') {
                grannyState.chaseTimer += delta;
                if (grannyState.chaseTimer > 4 || dist > 14) {
                    grannyState.state = 'patrol';
                    grannyState.chaseTimer = 0;
                    grannyState.targetX = (Math.random() - 0.5) * 20;
                    grannyState.targetZ = (Math.random() - 0.5) * 20;
                }
            }

            let targetX = grannyState.targetX;
            let targetZ = grannyState.targetZ;

            if (grannyState.state === 'chase') {
                targetX = px;
                targetZ = pz;
            }

            const bound = ROOM_SIZE / 2 - 1.5;
            targetX = Math.max(-bound, Math.min(bound, targetX));
            targetZ = Math.max(-bound, Math.min(bound, targetZ));

            let dx2 = targetX - gx;
            let dz2 = targetZ - gz;
            const dist2 = Math.sqrt(dx2 * dx2 + dz2 * dz2);

            if (dist2 > 0.3) {
                const speed = grannyState.state === 'chase' ? chaseSpeed : patrolSpeed;
                const moveSpeed = Math.min(speed * delta, dist2);
                const nx = gx + (dx2 / dist2) * moveSpeed;
                const nz = gz + (dz2 / dist2) * moveSpeed;

                const result = tryMove(nx, nz, 0.6);
                granny.position.x = result.x;
                granny.position.z = result.z;

                const lookAngle = Math.atan2(px - granny.position.x, pz - granny.position.z);
                granny.rotation.y = lookAngle;

                const bob = Math.sin(gameTime * 4) * 0.02;
                granny.position.y = FLOOR_Y + bob;

                const swing = Math.sin(gameTime * 4) * 0.15;
                granny.children.forEach(child => {
                    if (child.position.x < -0.5 && child.geometry.type === 'CylinderGeometry') {
                        child.rotation.x = -0.3 + swing;
                    }
                    if (child.position.x > 0.5 && child.geometry.type === 'CylinderGeometry') {
                        child.rotation.x = 0.3 - swing;
                    }
                });

                if (dist < 1.8 && grannyState.state === 'chase') {
                    gameOver(true);
                    return;
                }
            } else {
                if (grannyState.state === 'patrol') {
                    grannyState.targetX = (Math.random() - 0.5) * 24;
                    grannyState.targetZ = (Math.random() - 0.5) * 24;
                }
            }

            if (grannyState.state === 'patrol' && Math.random() < 0.005) {
                grannyState.targetX = (Math.random() - 0.5) * 24;
                grannyState.targetZ = (Math.random() - 0.5) * 24;
            }

            const eyeIntensity = 0.3 + grannyAlertLevel * 0.8;
            granny.children.forEach(child => {
                if (child.material && child.material.emissiveIntensity !== undefined &&
                    child.geometry.type === 'SphereGeometry' && child.position.y > 1.8) {
                    child.material.emissiveIntensity = eyeIntensity;
                }
            });
        }

        // ============================================================
        //  动画循环
        // ============================================================
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.05);
            gameTime += delta;

            // 更新自动漫游
            updatePath(delta);

            // 钥匙动画
            keys.forEach((key, i) => {
                if (key.userData.collected) return;
                const phase = key.userData.floatPhase;
                key.position.y = keyPositions[i][1] + Math.sin(gameTime * 1.5 + phase) * 0.2;
                key.rotation.y += delta * key.userData.rotSpeed;
                if (key.userData.glow) {
                    const intensity = 0.06 + Math.sin(gameTime * 2 + phase) * 0.04;
                    key.userData.glow.material.opacity = Math.max(0, intensity);
                }
            });

            // 灯光闪烁
            const flicker = Math.sin(gameTime * 3.7) * 0.15 + Math.sin(gameTime * 5.1 + 1) * 0.1;
            flickerLight.intensity = 0.6 + flicker * 0.5;
            flickerLight.color.setHSL(0.08 + Math.sin(gameTime * 0.3) * 0.02, 0.8, 0.5 + flicker * 0.1);
            const flicker2 = Math.sin(gameTime * 2.3 + 2) * 0.1;
            flickerLight2.intensity = 0.2 + flicker2 * 0.2;

            renderer.render(scene, camera);
        }

        // ============================================================
        //  窗口自适应
        // ============================================================
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // ============================================================
        //  启动
        // ============================================================
        function startGame() {
            initAudio();
            isPlaying = true;
            isGameOver = false;
            keysCollected = 0;
            gameTime = 0;
            pathIndex = 0;
            pathT = 0;
            const start = path[0];
            if (start) {
                camera.position.copy(start);
                camera.lookAt(path[1] || start);
            }
            // 重置老奶奶
            granny.position.set(-12, FLOOR_Y, -10);
            grannyState.state = 'patrol';
            grannyState.targetX = -12;
            grannyState.targetZ = -10;
            // 重置钥匙
            keys.forEach((key, i) => {
                key.userData.collected = false;
                key.visible = true;
                key.position.set(keyPositions[i][0], keyPositions[i][1], keyPositions[i][2]);
            });
            doorGlow.material.emissiveIntensity = 0;
            doorGlow.material.opacity = 0.3;
            doorPanelMesh.material.color.setHex(0x5a3d2e);
            doorPanelMesh.position.x = 0;
            doorPanelMesh.rotation.y = 0;
            updateHUD();
            showMessage('🚶 自动探索开始...', '', 2000);
            overlayScreen.classList.add('hidden');
        }

        mainBtn.addEventListener('click', startGame);

        // 初始状态：菜单
        overlayScreen.classList.remove('hidden');
        resultIcon.textContent = '🏚️';
        titleText.textContent = '恐怖老奶奶 · 自动漫游';
        subText.innerHTML =
            '你被困在阴森的宅邸中，<br />相机将自动带你探索。<br />收集 <strong>3 把钥匙</strong> 逃出，小心老奶奶！';
        mainBtn.textContent = '开始漫游';
        resultDetail.textContent = '';
        mainBtn.className = 'btn';

        // 启动渲染
        animate();

        console.log('🏚️ 恐怖老奶奶 · 自动漫游版已加载');
        console.log('🔑 收集3把钥匙，自动逃出！');
        console.log('👵 老奶奶会追逐你！');

        // ============================================================
        //  调试辅助
        // ============================================================
        window.__debug = {
            scene,
            camera,
            granny,
            keys,
            path,
            restart: restartGame,
        };
    </script>
