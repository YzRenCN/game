<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏮 古宅惊魂 · 恐怖老奶奶</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            overflow: hidden;
            background: #1a0f0a;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }

        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 24px;
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 24px;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 200, 150, 0.15);
            color: #f0e0d0;
            font-size: 16px;
            font-weight: 500;
            pointer-events: none;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }
        #hud .item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #hud .item .icon {
            font-size: 20px;
        }
        #hud .item .count {
            color: #ffd700;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }
        #hud .status {
            color: #bbb;
            font-size: 14px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding-left: 18px;
        }
        #hud .status .highlight {
            color: #ffd700;
            font-weight: 600;
        }

        #message {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            padding: 12px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 200, 150, 0.1);
            color: #f0e0d0;
            font-size: 18px;
            font-weight: 500;
            pointer-events: none;
            transition: opacity 0.5s, transform 0.5s;
            opacity: 0;
            transform: translateX(-50%) translateY(12px);
            text-align: center;
            max-width: 80%;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        #message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #message.danger {
            border-color: #ff4444;
            color: #ff8888;
        }
        #message.success {
            border-color: #44ff88;
            color: #88ffbb;
        }
        #message.info {
            border-color: #44aaff;
            color: #88ccff;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 28px;
            font-weight: 100;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        #vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(80, 30, 20, 0.0) 100%);
            transition: all 0.3s;
            opacity: 0;
        }
        #vignette.active {
            opacity: 1;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(160, 40, 20, 0.35) 80%);
        }
        #vignette.caught {
            opacity: 1;
            background: radial-gradient(ellipse at center, transparent 10%, rgba(200, 0, 0, 0.8) 90%);
            transition: 0.1s;
        }

        #heartbeat {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(180, 50, 30, 0.0) 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        #heartbeat.pulse {
            animation: pulse-red 0.5s ease-in-out infinite alternate;
        }
        @keyframes pulse-red {
            0% {
                opacity: 0.1;
            }
            100% {
                opacity: 0.6;
            }
        }

        #controls-hint {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            text-align: right;
            line-height: 1.6;
            pointer-events: none;
            font-weight: 300;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        #controls-hint kbd {
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            padding: 0 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
            font-family: inherit;
            color: rgba(255, 255, 255, 0.3);
        }

        #overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(14px);
            z-index: 100;
            pointer-events: auto;
            transition: opacity 0.8s ease;
        }
        #overlay-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #overlay-screen h1 {
            font-size: 60px;
            font-weight: 900;
            color: #f5d742;
            text-shadow: 0 0 60px rgba(245, 215, 66, 0.3);
            margin-bottom: 6px;
            letter-spacing: 6px;
        }
        #overlay-screen .sub {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 24px;
            text-align: center;
            max-width: 540px;
            line-height: 1.7;
        }
        #overlay-screen .sub strong {
            color: #ff6b6b;
        }
        #overlay-screen .btn {
            padding: 16px 48px;
            font-size: 20px;
            font-weight: 700;
            color: #1a0f0a;
            background: linear-gradient(135deg, #f5d742, #e6b800);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 30px rgba(245, 215, 66, 0.25);
            letter-spacing: 1px;
        }
        #overlay-screen .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(245, 215, 66, 0.4);
        }
        #overlay-screen .btn-secondary {
            background: linear-gradient(135deg, #5a3a2a, #3d2a1a);
            color: #f0e0d0;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            margin-top: 10px;
        }
        #overlay-screen .result-icon {
            font-size: 72px;
            margin-bottom: 8px;
        }
        #overlay-screen .result-detail {
            color: #888;
            font-size: 15px;
            margin-top: 6px;
        }
        #overlay-screen .end-buttons {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        @media (max-width: 600px) {
            #hud {
                font-size: 13px;
                padding: 6px 14px;
                gap: 12px;
                top: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }
            #hud .status {
                font-size: 12px;
                padding-left: 10px;
            }
            #overlay-screen h1 {
                font-size: 36px;
            }
            #overlay-screen .sub {
                font-size: 15px;
                padding: 0 16px;
            }
            #overlay-screen .btn {
                padding: 12px 28px;
                font-size: 16px;
            }
            #message {
                font-size: 15px;
                padding: 8px 18px;
                bottom: 70px;
                max-width: 90%;
            }
            #controls-hint {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="hud">
            <span class="item"><span class="icon">🔑</span><span class="count" id="key-count">0</span>/3</span>
            <span class="item"><span class="icon">📜</span><span class="count" id="scroll-count">0</span>/1</span>
            <span class="item"><span class="icon">🧿</span><span class="count" id="talisman-count">0</span>/1</span>
            <span class="status" id="hud-status">🔍 探索古宅</span>
        </div>

        <div id="message"></div>
        <div id="crosshair">✚</div>
        <div id="vignette"></div>
        <div id="heartbeat"></div>
        <div id="controls-hint">
            <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 &nbsp;·&nbsp; <kbd>鼠标</kbd> 视角<br />
            收集钥匙(3)逃出 · 符咒封印 · 遗物超度
        </div>
    </div>

    <div id="overlay-screen">
        <div class="result-icon" id="result-icon">🏮</div>
        <h1 id="title-text">古宅惊魂</h1>
        <div class="sub" id="sub-text">
            你踏入了一座荒废百年的中式古宅。<br />
            收集 <strong>3把钥匙</strong> 打开大门逃离，或寻找 <strong>符咒</strong> 封印老奶奶，<br />
            也可找到她的 <strong>遗物</strong> 让其安息。<br />
            小心！她在暗处注视着你...
        </div>
        <button class="btn" id="main-btn">开始探险</button>
        <div class="result-detail" id="result-detail"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        //  导入
        // ============================================================
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // ============================================================
        //  DOM 引用
        // ============================================================
        const overlay = document.getElementById('overlay-screen');
        const titleText = document.getElementById('title-text');
        const subText = document.getElementById('sub-text');
        const resultIcon = document.getElementById('result-icon');
        const mainBtn = document.getElementById('main-btn');
        const resultDetail = document.getElementById('result-detail');
        const keyCountEl = document.getElementById('key-count');
        const scrollCountEl = document.getElementById('scroll-count');
        const talismanCountEl = document.getElementById('talisman-count');
        const hudStatus = document.getElementById('hud-status');
        const msgEl = document.getElementById('message');
        const vignette = document.getElementById('vignette');
        const heartbeat = document.getElementById('heartbeat');

        // ============================================================
        //  游戏状态
        // ============================================================
        const STATE = { MENU: 0, PLAYING: 1, ENDED: 2 };
        let gameState = STATE.MENU;
        let isGameOver = false;
        let gameTime = 0;

        // 收集物
        let keysCollected = 0;
        const MAX_KEYS = 3;
        let hasScroll = false; // 遗物
        let hasTalisman = false; // 符咒
        let itemsCollected = { keys: 0, scroll: false, talisman: false };

        // 老奶奶
        let grannyAlert = 0;

        // ============================================================
        //  Three.js 设置
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a0f0a);
        scene.fog = new THREE.Fog(0x1a0f0a, 20, 45);

        const camera = new THREE.PerspectiveCamera(68, window.innerWidth / window.innerHeight, 0.1, 60);
        camera.position.set(0, 1.7, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // 控制器
        const controls = new PointerLockControls(camera, document.body);

        // ============================================================
        //  灯光 (亮度提升)
        // ============================================================
        // 环境光 - 暖色，更亮
        const ambient = new THREE.AmbientLight(0xccaa88, 0.45);
        scene.add(ambient);

        // 主光源 - 模拟月光透过窗
        const moon = new THREE.DirectionalLight(0xaaccff, 0.6);
        moon.position.set(-8, 15, 6);
        moon.castShadow = true;
        moon.shadow.mapSize.width = 2048;
        moon.shadow.mapSize.height = 2048;
        moon.shadow.camera.near = 0.5;
        moon.shadow.camera.far = 50;
        moon.shadow.camera.left = -20;
        moon.shadow.camera.right = 20;
        moon.shadow.camera.top = 20;
        moon.shadow.camera.bottom = -20;
        scene.add(moon);

        // 多个灯笼点光源 (暖色)
        const lanternPositions = [
            [-6, 3.0, -4],
            [7, 3.2, 5],
            [-5, 3.5, 9],
            [9, 3.0, -6],
            [-8, 2.8, -8],
            [0, 4.0, -2],
        ];
        const lanternLights = [];
        lanternPositions.forEach((pos) => {
            const light = new THREE.PointLight(0xff8844, 0.9, 12);
            light.position.set(pos[0], pos[1], pos[2]);
            light.castShadow = false;
            scene.add(light);
            lanternLights.push(light);
            // 添加视觉灯笼球
            const sphere = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xff8844, transparent: true, opacity: 0.3 })
            );
            sphere.position.copy(light.position);
            scene.add(sphere);
        });

        // 玩家手电筒 (增强)
        const flashlight = new THREE.SpotLight(0xffeedd, 2.2, 18, Math.PI / 5, 0.5, 1.8);
        flashlight.position.set(0, 1.6, 0);
        flashlight.target.position.set(0, 0, -6);
        flashlight.castShadow = false;
        scene.add(flashlight);
        scene.add(flashlight.target);

        // 额外补光
        const fill = new THREE.DirectionalLight(0xffaa66, 0.2);
        fill.position.set(0, 5, 10);
        scene.add(fill);

        // ============================================================
        //  古宅场景构建
        // ============================================================
        const ROOM_SIZE = 30;
        const WALL_HEIGHT = 4.8;
        const FLOOR_Y = 0;

        // ---- 地板 (木纹色) ----
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x4a3222,
            roughness: 0.8,
            metalness: 0.0,
        });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = FLOOR_Y;
        floor.receiveShadow = true;
        scene.add(floor);

        // 地板格子装饰
        const grid = new THREE.GridHelper(ROOM_SIZE, 24, 0x6a4a32, 0x3d2a1a);
        grid.position.y = FLOOR_Y + 0.02;
        grid.material.transparent = true;
        grid.material.opacity = 0.15;
        scene.add(grid);

        // ---- 墙壁 (中式风格) ----
        function createWall(w, h, posX, posY, posZ, rotY = 0, color = 0x5a3a2a) {
            const geo = new THREE.BoxGeometry(w, h, 0.25);
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0.0 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(posX, posY + h / 2, posZ);
            mesh.rotation.y = rotY;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        const half = ROOM_SIZE / 2;
        const wallColor = 0x5a3a2a;
        const wallDark = 0x3d2a1a;

        // 外壁
        createWall(ROOM_SIZE, WALL_HEIGHT, 0, 0, -half, 0, wallColor);
        createWall(ROOM_SIZE, WALL_HEIGHT, 0, 0, half, 0, wallColor);
        createWall(ROOM_SIZE, WALL_HEIGHT, -half, 0, 0, 0, wallColor);
        createWall(ROOM_SIZE, WALL_HEIGHT, half, 0, 0, 0, wallColor);

        // 内墙 - 形成回廊和房间
        // 横向隔断 (z=0附近)
        createWall(18, WALL_HEIGHT, -2, 0, 0, 0, wallDark);
        createWall(18, WALL_HEIGHT, 8, 0, 0, 0, wallDark);
        // 纵向隔断
        createWall(12, WALL_HEIGHT, -6, 0, -4, 0, wallDark);
        createWall(12, WALL_HEIGHT, 6, 0, 4, 0, wallDark);
        createWall(10, WALL_HEIGHT, -6, 0, 6, 0, wallDark);
        createWall(10, WALL_HEIGHT, 6, 0, -6, 0, wallDark);

        // 支柱 (圆木柱)
        function createPillar(x, z) {
            const geo = new THREE.CylinderGeometry(0.35, 0.45, WALL_HEIGHT, 10);
            const mat = new THREE.MeshStandardMaterial({ color: 0x4a3222, roughness: 0.9 });
            const p = new THREE.Mesh(geo, mat);
            p.position.set(x, WALL_HEIGHT / 2, z);
            p.castShadow = true;
            p.receiveShadow = true;
            scene.add(p);
            // 柱础
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(0.5, 0.6, 0.15, 10),
                new THREE.MeshStandardMaterial({ color: 0x3d2a1a, roughness: 0.9 })
            );
            base.position.set(x, 0.08, z);
            scene.add(base);
            return p;
        }
        const pillarPos = [
            [-8, -8],
            [-8, 8],
            [8, -8],
            [8, 8],
            [-12, -4],
            [-12, 4],
            [12, -4],
            [12, 4],
            [-4, -12],
            [4, -12],
            [-4, 12],
            [4, 12]
        ];
        pillarPos.forEach(([x, z]) => createPillar(x, z));

        // ---- 中式家具 ----
        function createTable(x, z, rot = 0) {
            const group = new THREE.Group();
            const topMat = new THREE.MeshStandardMaterial({ color: 0x5a3a2a, roughness: 0.7 });
            const legMat = new THREE.MeshStandardMaterial({ color: 0x3d2a1a, roughness: 0.9 });
            const top = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.12, 1.0), topMat);
            top.position.y = 0.7;
            top.castShadow = true;
            top.receiveShadow = true;
            group.add(top);
            const legPos = [
                [-0.6, -0.35],
                [0.6, -0.35],
                [-0.6, 0.35],
                [0.6, 0.35]
            ];
            legPos.forEach(([lx, lz]) => {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.6, 6), legMat);
                leg.position.set(lx, 0.3, lz);
                leg.castShadow = true;
                group.add(leg);
            });
            group.position.set(x, FLOOR_Y, z);
            group.rotation.y = rot;
            scene.add(group);
            return group;
        }

        function createCabinet(x, z, rot = 0) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a3222, roughness: 0.8 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.4, 0.5), bodyMat);
            body.position.y = 0.7;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);
            // 门把手
            const handleMat = new THREE.MeshStandardMaterial({ color: 0xccaa66, metalness: 0.5, roughness: 0.3 });
            const handle = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), handleMat);
            handle.position.set(0.35, 0.7, 0.28);
            group.add(handle);
            group.position.set(x, FLOOR_Y, z);
            group.rotation.y = rot;
            scene.add(group);
            return group;
        }

        function createChair(x, z, rot = 0) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x4a3222, roughness: 0.8 });
            const seat = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 0.6), mat);
            seat.position.y = 0.4;
            seat.castShadow = true;
            group.add(seat);
            const legPos = [
                [-0.25, -0.25],
                [0.25, -0.25],
                [-0.25, 0.25],
                [0.25, 0.25]
            ];
            legPos.forEach(([lx, lz]) => {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.35, 6), mat);
                leg.position.set(lx, 0.18, lz);
                group.add(leg);
            });
            // 靠背
            const back = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.04), mat);
            back.position.set(0, 0.65, -0.3);
            group.add(back);
            group.position.set(x, FLOOR_Y, z);
            group.rotation.y = rot;
            scene.add(group);
            return group;
        }

        // 放置家具
        createTable(-6, -5, 0.2);
        createTable(7, 6, -0.4);
        createTable(-7, 9, 0.6);
        createTable(9, -7, 1.2);
        createCabinet(-10, -4, 0.3);
        createCabinet(10, 4, -0.2);
        createCabinet(-3, 12, 0.5);
        createChair(-5, -3, 0.8);
        createChair(5, 7, -0.6);
        createChair(-8, 7, 0.2);
        createChair(8, -5, -0.3);

        // ---- 屏风 (装饰) ----
        function createScreen(x, z, rot = 0) {
            const group = new THREE.Group();
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x3d2a1a, roughness: 0.9 });
            const panelMat = new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 0.7, transparent: true,
                opacity: 0.6 });
            for (let i = -1; i <= 1; i++) {
                const panel = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.8, 0.04), panelMat);
                panel.position.set(i * 0.65, 0.9, 0);
                panel.castShadow = true;
                group.add(panel);
                // 边框
                const frame = new THREE.Mesh(new THREE.BoxGeometry(0.62, 1.82, 0.06), frameMat);
                frame.position.set(i * 0.65, 0.9, 0);
                group.add(frame);
            }
            group.position.set(x, FLOOR_Y, z);
            group.rotation.y = rot;
            scene.add(group);
            return group;
        }
        createScreen(-8, -2, 0.8);
        createScreen(8, 2, -0.5);

        // ---- 字画 (装饰) ----
        function createScroll(x, y, z, rotY = 0) {
            const group = new THREE.Group();

        function addObstacle(x1, z1, x2, z2) {
            obstacles.push({
                xMin: Math.min(x1, x2),
                xMax: Math.max(x1, x2),
                zMin: Math.min(z1, z2),
                zMax: Math.max(z1, z2),
            });

        function checkCollision(x, z, radius = 0.45) {
            for (const ob of obstacles) {
                if (ob.xMin === undefined) continue;
                // 矩形碰撞
                const cx = Math.max(ob.xMin, Math.min(x, ob.xMax));
                const cz = Math.max(ob.zMin, Math.min(z, ob.zMax));
                const dx = x - cx;
                const dz = z - cz;
                if (dx * dx + dz * dz < radius * radius) {
                    return true;
                }
            }
            return false;
        }

        function tryMove(x, z, radius = 0.45) {
            if (!checkCollision(x, z, radius)) {
                return { x, z, ok: true };
            }
            // 尝试x
            if (!checkCollision(x, granny.position.z, radius)) {
                return { x, z: granny.position.z, ok: true };
            }
            if (!checkCollision(granny.position.x, z, radius)) {
                return { x: granny.position.x, z, ok: true };
            }
            // 微调
            const step = 0.05;
            for (let dx of [-step, step]) {
                for (let dz of [-step, step]) {
                    const nx = granny.position.x + dx;
                    const nz = granny.position.z + dz;
                    if (!checkCollision(nx, nz, radius)) {
                        return { x: nx, z: nz, ok: true };
                    }
                }
            }
            return { x: granny.position.x, z: granny.position.z, ok: false };
        }

        // ============================================================

        // ============================================================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
        }

        function playTone(freq, dur, type = 'sine', vol = 0.12) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch (e) { /* 静默 */ }
        }

        function playPickup() {
            playTone(880, 0.15);
            setTimeout(() => playTone(1100, 0.12), 100);
        }

        function checkWinCondition() {
            if (isGameOver) return;
            // 检查是否达成多种结局
            // 结局1: 收集3钥匙并到达出口
            // 结局2: 获得符咒后靠近老奶奶使用 (需要在更新循环检测)
            // 结局3: 获得遗物后靠近老奶奶使用
        }

        // 检测玩家与物品的交互 (在更新循环中)
        function checkItemPickup() {
            const px = camera.position.x;
            const pz = camera.position.z;
            // 钥匙
            keyGroups.forEach((g) => {
                if (g.userData.collected) return;
                const dx = px - g.position.x;
                const dz = pz - g.position.z;
                if (dx * dx + dz * dz < 1.8) {
                    collectItem(g);
                }
            });
            // 遗物
            if (!scrollGroup.userData.collected) {
                const dx = px - scrollGroup.position.x;
                const dz = pz - scrollGroup.position.z;
                if (dx * dx + dz * dz < 1.8) {
                    collectItem(scrollGroup);
                }
            }
            // 符咒
            if (!talismanGroup.userData.collected) {
                const dx = px - talismanGroup.position.x;
                const dz = pz - talismanGroup.position.z;
                if (dx * dx + dz * dz < 1.8) {
                    collectItem(talismanGroup);
                }
            }
        }

        // 检测出口
        function checkExit() {
            if (keysCollected < MAX_KEYS) return false;
            const dx = camera.position.x - 0;
            const dz = camera.position.z - (half - 1.5);
            return (dx * dx + dz * dz) < 2.5;
        }

        // 检测与老奶奶互动 (使用符咒或遗物)
        function checkGrannyInteraction() {
            if (isGameOver) return;
            const dx = camera.position.x - granny.position.x;
            const dz = camera.position.z - granny.position.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            if (dist > 3.0) return;

            // 有符咒且老奶奶在附近 → 封印结局
            if (hasTalisman && !isGameOver) {
                // 封印老奶奶

                return;

            if (hasScroll && !isGameOver) {

                return;

        function gameOver(win = false, type = 'escape') {

            isGameOver = true;
            gameState = STATE.ENDED;
            controls.unlock();

            let title = '',
                icon = '',
                desc = '',
                detail = '';

                playWin();
            } else if (type === 'caught') {
                title = '💀 被抓住了...';
                icon = '😱';
                desc = '老奶奶在黑暗中抓住了你，你永远留在了古宅。';
                detail = '游戏结束';
                playCaught();

                desc = '你用符咒封印了老奶奶，古宅恢复了宁静。';
                detail = '恭喜你完成了封印结局！';
                playWin();
            } else if (type === 'exorcise') {

                icon = '🌟';
                desc = '你找到了老奶奶的遗物，让她得以安息。';
                detail = '你给予了亡魂平静，获得了救赎。';
                playWin();

                title = '⏳ 时间耗尽';
                icon = '⌛';
                desc = '你在古宅中徘徊了太久，被黑暗吞噬。';
                detail = '时间诅咒降临...';

            keysCollected = 0;
            hasScroll = false;
            hasTalisman = false;
            isGameOver = false;
            gameState = STATE.PLAYING;
            grannyAlert = 0;
            gameTime = 0;
            selectedIndices = [];

            // 重置物品
            keyGroups.forEach((g) => { g.userData.collected = false;
                g.visible = true; });
            scrollGroup.userData.collected = false;
            scrollGroup.visible = true;
            talismanGroup.userData.collected = false;
            talismanGroup.visible = true;

            // 重置门
            doorGlow.material.emissiveIntensity = 0;
            doorGlow.material.opacity = 0.3;
            doorPanelMesh.material.color.setHex(0x6a4a32);
            doorPanelMesh.position.x = 0;
            doorPanelMesh.rotation.y = 0;

            // 重置老奶奶
            granny.position.set(-10, FLOOR_Y, -8);
            grannyState.targetX = -10;
            grannyState.targetZ = -8;
            grannyState.state = 'patrol';
            grannyState.chaseTimer = 0;
            grannyState.patrolPoints = generatePatrolPoints();
            grannyState.currentPatrolIdx = 0;

            // 重置玩家
            camera.position.set(0, 1.7, -10);

            // UI
            vignette.className = '';
            heartbeat.className = '';
            heartbeat.style.opacity = '0';
            updateHUD();
            showMessage('🏮 探索古宅，寻找出路...', 'info', 2000);

            overlay.classList.add('hidden');
            controls.lock();
        }

        // ============================================================
        //  老奶奶 AI (增强)
        // ============================================================
        function updateGranny(delta) {
            if (isGameOver) return;

            const gx = granny.position.x;
            const gz = granny.position.z;
            const px = camera.position.x;
            const pz = camera.position.z;

            const dx = px - gx;
            const dz = pz - gz;
            const dist = Math.sqrt(dx * dx + dz * dz);

            // 更新警报
            if (dist < 14) {
                grannyAlert = Math.min(1, grannyAlert + delta * 0.25);
                if (dist < 9 && !isGameOver) {
                    heartbeat.className = 'pulse';
                    heartbeat.style.opacity = '1';
                    if (Math.random() < 0.015) playHeartbeat();
                } else {
                    heartbeat.className = '';
                    heartbeat.style.opacity = '0';
                }
                if (dist < 7) {
                    vignette.className = 'active';
                    const intensity = 1 - (dist / 7);
                    vignette.style.opacity = intensity * 0.5 + 0.15;
                } else {
                    vignette.className = '';
                    vignette.style.opacity = '0';
                }
            } else {
                grannyAlert = Math.max(0, grannyAlert - delta * 0.08);
                if (grannyAlert < 0.1) {
                    heartbeat.className = '';
                    heartbeat.style.opacity = '0';
                    vignette.className = '';
                    vignette.style.opacity = '0';
                }
            }

            // 状态切换
            const patrolSpeed = 0.9 + (difficulty === 'hard' ? 0.3 : 0);
            const chaseSpeed = 2.8 + (difficulty === 'hard' ? 0.6 : 0.2);

            if (dist < 8 && grannyAlert > 0.4) {
                grannyState.state = 'chase';
                grannyState.lastSeenX = px;
                grannyState.lastSeenZ = pz;
                grannyState.chaseTimer = 0;
            } else if (grannyState.state === 'chase') {
                grannyState.chaseTimer += delta;
                if (grannyState.chaseTimer > 5 || dist > 16) {
                    grannyState.state = 'patrol';
                    grannyState.chaseTimer = 0;
                    grannyState.currentPatrolIdx = (grannyState.currentPatrolIdx + 1) % grannyState.patrolPoints.length;
                    const pt = grannyState.patrolPoints[grannyState.currentPatrolIdx];
                    grannyState.targetX = pt.x;
                    grannyState.targetZ = pt.z;
                }
            }

            // 移动
            let targetX = grannyState.targetX;
            let targetZ = grannyState.targetZ;
            if (grannyState.state === 'chase') {
                targetX = px;
                targetZ = pz;
                // 困难模式会预判玩家方向
                if (difficulty === 'hard') {
                    // 稍微预测玩家移动方向 (简单预测)
                    const dirX = px - grannyState.lastSeenX;
                    const dirZ = pz - grannyState.lastSeenZ;
                    const len = Math.sqrt(dirX * dirX + dirZ * dirZ);
                    if (len > 0.5) {
                        targetX += dirX / len * 1.2;
                        targetZ += dirZ / len * 1.2;
                    }
                }
            }

            // 限制边界
            const bound = half - 1.5;
            targetX = Math.max(-bound, Math.min(bound, targetX));
            targetZ = Math.max(-bound, Math.min(bound, targetZ));

            let dx2 = targetX - gx;
            let dz2 = targetZ - gz;
            const dist2 = Math.sqrt(dx2 * dx2 + dz2 * dz2);

            if (dist2 > 0.3) {
                const speed = grannyState.state === 'chase' ? chaseSpeed : patrolSpeed;
                const moveSpeed = Math.min(speed * delta * 1.2, dist2);
                const nx = gx + (dx2 / dist2) * moveSpeed;
                const nz = gz + (dz2 / dist2) * moveSpeed;

                const result = tryMove(nx, nz, 0.6);
                granny.position.x = result.x;
                granny.position.z = result.z;

                // 朝向玩家
                const lookAngle = Math.atan2(px - granny.position.x, pz - granny.position.z);
                granny.rotation.y = lookAngle;

                // 走路动画
                const bob = Math.sin(gameTime * 5) * 0.025;
                granny.position.y = FLOOR_Y + bob;

                // 手臂摆动
                const swing = Math.sin(gameTime * 5) * 0.2;
                granny.children.forEach(child => {
                    if (child.position.x < -0.5 && child.geometry.type === 'CylinderGeometry') {
                        child.rotation.x = -0.3 + swing;
                    }
                    if (child.position.x > 0.5 && child.geometry.type === 'CylinderGeometry') {
                        child.rotation.x = 0.3 - swing;
                    }
                });

                // 检查抓住玩家
                if (dist < 1.8 && grannyState.state === 'chase') {
                    gameOver(false, 'caught');
                    return;
                }
            } else {
                // 到达巡逻点
                if (grannyState.state === 'patrol') {
                    grannyState.currentPatrolIdx = (grannyState.currentPatrolIdx + 1) % grannyState.patrolPoints.length;
                    const pt = grannyState.patrolPoints[grannyState.currentPatrolIdx];
                    grannyState.targetX = pt.x;
                    grannyState.targetZ = pt.z;
                }
            }

            // 巡逻时随机改变目标
            if (grannyState.state === 'patrol' && Math.random() < 0.003) {
                grannyState.currentPatrolIdx = Math.floor(Math.random() * grannyState.patrolPoints.length);
                const pt = grannyState.patrolPoints[grannyState.currentPatrolIdx];
                grannyState.targetX = pt.x;
                grannyState.targetZ = pt.z;
            }

            // 眼睛发光
            const eyeIntensity = 0.3 + grannyAlert * 0.8;
            granny.children.forEach(child => {
                if (child.material && child.material.emissiveIntensity !== undefined &&
                    child.geometry.type === 'SphereGeometry' && child.position.y > 1.8) {
                    child.material.emissiveIntensity = eyeIntensity;
                }
            });

            // 与玩家交互 (符咒/遗物)
            if (dist < 3.0 && !isGameOver) {
                checkGrannyInteraction();
            }
        }

        // ============================================================
        //  玩家移动
        // ============================================================
        const keys = { w: false, a: false, s: false, d: false };
        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW':
                    keys.w = true;
                    e.preventDefault();
                    break;
                case 'KeyA':
                    keys.a = true;
                    e.preventDefault();
                    break;
                case 'KeyS':
                    keys.s = true;
                    e.preventDefault();
                    break;
                case 'KeyD':
                    keys.d = true;
                    e.preventDefault();
                    break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW':
                    keys.w = false;
                    e.preventDefault();
                    break;
                case 'KeyA':
                    keys.a = false;
                    e.preventDefault();
                    break;
                case 'KeyS':
                    keys.s = false;
                    e.preventDefault();
                    break;
                case 'KeyD':
                    keys.d = false;
                    e.preventDefault();
                    break;
            }
        });

        function updatePlayer(delta) {
            if (isGameOver || gameState !== STATE.PLAYING) return;

            const speed = 3.6;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            forward.y = 0;
            right.y = 0;
            forward.normalize();
            right.normalize();

            let moveX = 0,
                moveZ = 0;
            if (keys.w) { moveX += forward.x;
                moveZ += forward.z; }
            if (keys.s) { moveX -= forward.x;
                moveZ -= forward.z; }
            if (keys.a) { moveX -= right.x;
                moveZ -= right.z; }
            if (keys.d) { moveX += right.x;
                moveZ += right.z; }

            if (moveX !== 0 || moveZ !== 0) {
                const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
                moveX /= len;
                moveZ /= len;
                const dist = speed * delta;
                const nx = camera.position.x + moveX * dist;
                const nz = camera.position.z + moveZ * dist;
                const result = tryMovePlayer(nx, nz);
                camera.position.x = result.x;
                camera.position.z = result.z;

                // 检查物品收集
                checkItemPickup();

                // 检查出口
                if (checkExit() && keysCollected === MAX_KEYS) {
                    gameOver(true, 'escape');
                    return;
                }
            }

            // 更新手电筒
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            flashlight.position.copy(camera.position);
            flashlight.position.y += 0.2;
            flashlight.target.position.copy(camera.position).add(dir.multiplyScalar(6));
            flashlight.target.updateMatrixWorld();

            // 脚步音效
            if ((keys.w || keys.s || keys.a || keys.d) && Math.random() < 0.02) {
                playTone(70 + Math.random() * 30, 0.04, 'sine', 0.02);
            }
        }

        // ============================================================
        //  UI 交互
        // ============================================================
        let selectedIndices = [];

        // 点击开始
        mainBtn.addEventListener('click', () => {
            initAudio();
            if (gameState === STATE.MENU || gameState === STATE.ENDED) {
                restartGame();
            } else {
                controls.lock();
            }
        });

        renderer.domElement.addEventListener('click', () => {
            if (gameState === STATE.PLAYING && !isGameOver) {
                controls.lock();
            }
        });

        controls.addEventListener('unlock', () => { /* 可处理 */ });
        controls.addEventListener('lock', () => { /* 可处理 */ });

        // ============================================================
        //  难度 (增加困难程度)
        // ============================================================
        let difficulty = 'medium'; // 通过界面按钮可以调整，但这里写死为hard增强难度
        // 默认设为hard
        difficulty = 'hard';

        // ============================================================
        //  主循环
        // ============================================================
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);
            gameTime += delta;

            if (gameState === STATE.PLAYING && !isGameOver) {
                updatePlayer(delta);
                updateGranny(delta);

                // 物品漂浮动画
                [...keyGroups, scrollGroup, talismanGroup].forEach((g) => {
                    if (g.userData.collected) return;
                    const phase = g.userData.floatPhase || 0;
                    g.position.y += Math.sin(gameTime * 1.2 + phase) * 0.002;
                    g.rotation.y += delta * 0.8;
                    if (g.userData.glow) {
                        const intensity = 0.06 + Math.sin(gameTime * 2 + phase) * 0.04;
                        g.userData.glow.material.opacity = Math.max(0, intensity);
                    }
                });

                // 灯笼闪烁
                lanternLights.forEach((light, i) => {
                    const flicker = Math.sin(gameTime * (2 + i * 0.7)) * 0.15 + Math.sin(gameTime * (3.3 + i)) *
                        0.1;
                    light.intensity = 0.7 + flicker * 0.4;
                });

                // 玩家晃动
                if (keys.w || keys.s || keys.a || keys.d) {
                    const bob = Math.sin(gameTime * 14) * 0.012;
                    camera.position.y = 1.7 + bob;
                } else {
                    camera.position.y += (1.7 - camera.position.y) * 0.05;
                }

                // 时间结局 (5分钟)
                if (gameTime > 300) {
                    gameOver(false, 'timeout');
                }
            }

            renderer.render(scene, camera);
        }

        // ============================================================
        //  窗口自适应
        // ============================================================
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // ============================================================
        //  启动
        // ============================================================
        gameState = STATE.MENU;
        overlay.classList.remove('hidden');
        resultIcon.textContent = '🏮';
        titleText.textContent = '古宅惊魂';
        subText.innerHTML =
            '你踏入了一座荒废百年的中式古宅。<br />收集 <strong>3把钥匙</strong> 打开大门逃离，或寻找 <strong>符咒</strong> 封印老奶奶，<br />也可找到她的 <strong>遗物</strong> 让其安息。<br />小心！她在暗处注视着你...';
        mainBtn.textContent = '开始探险';
        resultDetail.textContent = '';
        mainBtn.className = 'btn';
        mainBtn.onclick = () => {
            initAudio();
            restartGame();
        };

        updateHUD();
        showMessage('🏮 点击 "开始探险" 进入古宅', 'info', 3000);

        animate();

        console.log('🏮 古宅惊魂 · 恐怖老奶奶 增强版');
        console.log('🔑 收集3钥匙逃出 / 🧿 符咒封印 / 📜 遗物超度');
        console.log('👵 老奶奶AI增强，难度提高');
    </script>
</body>
</html>
