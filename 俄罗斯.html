
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹俄罗斯方块</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
            touch-action: none;
        }

        .game-container {
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.2);
        }

        canvas {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 4px;
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .btn-control {
            transition: all 0.1s;
            active: scale-95;
        }
        
        .btn-control:active {
            transform: scale(0.95);
            background-color: #334155;
        }

        /* Modal Animation */
        .modal-enter {
            opacity: 0;
            transform: scale(0.9);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.3s, transform 0.3s;
        }
        .modal-exit {
            opacity: 1;
            transform: scale(1);
        }
        .modal-exit-active {
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.3s, transform 0.3s;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- Background Effects -->
    <div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(#334155 1px, transparent 1px); background-size: 20px 20px;"></div>

    <!-- Header -->
    <header class="absolute top-4 w-full text-center z-10">
        <h1 class="text-4xl md:text-5xl font-bold text-cyan-400 neon-text tracking-wider">TETRIS <span class="text-pink-500 text-2xl align-top">NEON</span></h1>
    </header>

    <!-- Main Game Area -->
    <main class="relative z-10 flex flex-col md:flex-row gap-6 items-start justify-center w-full max-w-4xl p-4">
        
        <!-- Left Panel: Stats -->
        <div class="hidden md:flex flex-col gap-4 w-48 order-2 md:order-1">
            <div class="bg-slate-800/80 backdrop-blur p-4 rounded-xl border border-slate-700 shadow-lg">
                <h3 class="text-slate-400 text-sm uppercase mb-1">Score</h3>
                <p id="score-display" class="text-2xl font-bold text-white">0</p>
            </div>
            <div class="bg-slate-800/80 backdrop-blur p-4 rounded-xl border border-slate-700 shadow-lg">
                <h3 class="text-slate-400 text-sm uppercase mb-1">Level</h3>
                <p id="level-display" class="text-2xl font-bold text-yellow-400">1</p>
            </div>
            <div class="bg-slate-800/80 backdrop-blur p-4 rounded-xl border border-slate-700 shadow-lg">
                <h3 class="text-slate-400 text-sm uppercase mb-1">Lines</h3>
                <p id="lines-display" class="text-2xl font-bold text-green-400">0</p>
            </div>
        </div>

        <!-- Center: Canvas -->
        <div class="relative order-1 md:order-2 game-container rounded-lg overflow-hidden">
            <canvas id="tetris" width="240" height="400" class="block"></canvas>
            
            <!-- Mobile Stats Overlay (Top) -->
            <div class="md:hidden absolute top-2 left-2 right-2 flex justify-between text-xs font-bold bg-black/50 p-2 rounded backdrop-blur-sm">
                <span>SCORE: <span id="mobile-score">0</span></span>
                <span>LVL: <span id="mobile-level">1</span></span>
            </div>
        </div>

        <!-- Right Panel: Next Piece & Controls Info -->
        <div class="flex flex-col gap-4 w-full md:w-48 order-3">
            <div class="bg-slate-800/80 backdrop-blur p-4 rounded-xl border border-slate-700 shadow-lg flex flex-col items-center">
                <h3 class="text-slate-400 text-sm uppercase mb-2 w-full text-left">Next</h3>
                <canvas id="next-piece" width="100" height="100" class="bg-slate-900/50 rounded border border-slate-700"></canvas>
            </div>

            <div class="bg-slate-800/80 backdrop-blur p-4 rounded-xl border border-slate-700 shadow-lg hidden md:block">
                <h3 class="text-slate-400 text-sm uppercase mb-2">Controls</h3>
                <ul class="text-xs text-slate-300 space-y-2">
                    <li class="flex justify-between"><span>Move</span> <span class="text-cyan-400">← →</span></li>
                    <li class="flex justify-between"><span>Rotate</span> <span class="text-cyan-400">↑</span></li>
                    <li class="flex justify-between"><span>Soft Drop</span> <span class="text-cyan-400">↓</span></li>
                    <li class="flex justify-between"><span>Hard Drop</span> <span class="text-cyan-400">Space</span></li>
                    <li class="flex justify-between"><span>Pause</span> <span class="text-cyan-400">P</span></li>
                </ul>
            </div>

            <!-- Mobile Controls -->
            <div class="md:hidden grid grid-cols-3 gap-2 mt-2">
                <button id="btn-rotate" class="btn-control bg-slate-700 p-4 rounded-lg text-white shadow-lg"><i class="fas fa-rotate-right"></i></button>
                <button id="btn-drop" class="btn-control bg-slate-700 p-4 rounded-lg text-white shadow-lg"><i class="fas fa-arrow-down"></i></button>
                <button id="btn-pause-mobile" class="btn-control bg-slate-700 p-4 rounded-lg text-white shadow-lg"><i class="fas fa-pause"></i></button>
                <button id="btn-left" class="btn-control bg-slate-700 p-4 rounded-lg text-white shadow-lg col-start-1"><i class="fas fa-arrow-left"></i></button>
                <button id="btn-down" class="btn-control bg-slate-700 p-4 rounded-lg text-white shadow-lg"><i class="fas fa-chevron-down"></i></button>
                <button id="btn-right" class="btn-control bg-slate-700 p-4 rounded-lg text-white shadow-lg col-start-3"><i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="absolute bottom-4 text-slate-500 text-xs z-10">
        <p>Press <span class="text-cyan-400">H</span> for Help | High Score: <span id="high-score">0</span></p>
    </footer>

    <!-- Modals -->
    <div id="start-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm modal-enter-active">
        <div class="bg-slate-800 p-8 rounded-2xl border border-cyan-500/50 shadow-2xl text-center max-w-sm w-full mx-4">
            <h2 class="text-3xl font-bold text-white mb-2 neon-text">READY?</h2>
            <p class="text-slate-400 mb-6">Use arrow keys to play.</p>
            <button id="start-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-6 rounded-lg transition-all shadow-[0_0_15px_rgba(8,145,178,0.5)] hover:shadow-[0_0_25px_rgba(8,145,178,0.8)]">
                START GAME
            </button>
        </div>
    </div>

    <div id="pause-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden">
        <div class="bg-slate-800 p-6 rounded-xl border border-yellow-500/50 shadow-xl text-center">
            <h2 class="text-2xl font-bold text-yellow-400 mb-4">PAUSED</h2>
            <button id="resume-btn" class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded transition">Resume</button>
        </div>
    </div>

    <div id="gameover-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md hidden">
        <div class="bg-slate-800 p-8 rounded-2xl border border-red-500/50 shadow-2xl text-center max-w-sm w-full mx-4">
            <h2 class="text-4xl font-bold text-red-500 mb-2 neon-text">GAME OVER</h2>
            <div class="my-6 space-y-2">
                <p class="text-slate-300">Final Score</p>
                <p id="final-score" class="text-5xl font-bold text-white">0</p>
            </div>
            <button id="restart-btn" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-6 rounded-lg transition-all shadow-[0_0_15px_rgba(220,38,38,0.5)]">
                TRY AGAIN
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
