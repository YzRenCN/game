
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹俄罗斯方块</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
            touch-action: none; /* 防止移动端滚动 */
        }

        /* 霓虹发光效果 */
        .neon-text {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #0ff, 0 0 30px #0ff, 0 0 40px #0ff;
        }
        
        .neon-box {
            box-shadow: 0 0 5px #0ff, 0 0 10px #0ff inset;
            border: 2px solid #0ff;
        }

        .game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        canvas {
            display: block;
            background-color: #1e293b;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }

        /* 动画类 */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-hover:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
        }
        
        .control-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center bg-slate-900 selection:bg-cyan-500 selection:text-white">

    <!-- 背景装饰 -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-500/10 rounded-full blur-3xl"></div>
    </div>

    <!-- 主界面容器 -->
    <div class="relative z-10 flex flex-col md:flex-row gap-6 items-start max-w-5xl w-full p-4 h-full md:h-auto justify-center">
        
        <!-- 左侧：游戏画布区域 -->
        <div class="relative game-container rounded-lg overflow-hidden border-2 border-slate-700 bg-slate-800/50 backdrop-blur-sm">
            <canvas id="tetris" width="240" height="400" class="w-[240px] h-[400px] md:w-[300px] md:h-[500px]"></canvas>
            
            <!-- 暂停/结束 遮罩层 -->
            <div id="overlay" class="absolute inset-0 bg-slate-900/80 flex flex-col items-center justify-center z-20 hidden">
                <h2 id="overlay-title" class="text-3xl font-bold text-cyan-400 mb-4 neon-text">PAUSED</h2>
                <button id="resume-btn" class="px-6 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-full font-bold transition-all btn-hover mb-2">
                    <i class="fas fa-play mr-2"></i>继续
                </button>
                <button id="restart-btn-overlay" class="px-6 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-full font-bold transition-all btn-hidden hidden btn-hover">
                    <i class="fas fa-redo mr-2"></i>重新开始
                </button>
            </div>
        </div>

        <!-- 右侧：信息面板与控制 -->
        <div class="flex flex-col gap-4 w-full md:w-64 h-full md:h-[500px]">
            
            <!-- 标题 -->
            <div class="text-center md:text-left">
                <h1 class="text-2xl md:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 tracking-wider">
                    TETRIS
                </h1>
                <p class="text-xs text-slate-400 mt-1">经典复刻版 v1.0</p>
            </div>

            <!-- 分数板 -->
            <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 shadow-lg flex-1 flex flex-col justify-center gap-4">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <span class="text-slate-400 text-sm"><i class="fas fa-star text-yellow-400 mr-2"></i>分数</span>
                    <span id="score" class="text-xl font-mono text-white">0</span>
                </div>
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <span class="text-slate-400 text-sm"><i class="fas fa-layer-group text-green-400 mr-2"></i>等级</span>
                    <span id="level" class="text-xl font-mono text-white">1</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 text-sm"><i class="fas fa-list text-blue-400 mr-2"></i>消除行</span>
                    <span id="lines" class="text-xl font-mono text-white">0</span>
                </div>
            </div>

            <!-- 下一个方块预览 -->
            <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 shadow-lg h-32 flex flex-col items-center justify-center relative">
                <span class="absolute top-2 left-3 text-xs text-slate-500 uppercase tracking-widest">Next</span>
                <canvas id="next-piece" width="80" height="80" class="w-20 h-20"></canvas>
            </div>

            <!-- 控制按钮 (桌面端显示快捷键提示，移动端显示触摸按钮) -->
            <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 shadow-lg flex-1 flex flex-col justify-between">
                
                <!-- 桌面端操作说明 -->
                <div class="hidden md:block text-xs text-slate-400 space-y-2 font-mono">
                    <div class="flex justify-between"><span>移动</span> <span class="text-cyan-400">← →</span></div>
                    <div class="flex justify-between"><span>旋转</span> <span class="text-cyan-400">↑</span></div>
                    <div class="flex justify-between"><span>加速下落</span> <span class="text-cyan-400">↓</span></div>
                    <div class="flex justify-between"><span>硬降落</span> <span class="text-cyan-400">Space</span></div>
                    <div class="flex justify-between"><span>暂停</span> <span class="text-cyan-400">P / Esc</span></div>
                </div>

                <!-- 移动端触摸控制 -->
                <div class="md:hidden grid grid-cols-3 gap-2 h-full">
                    <div class="col-start-2 flex items-center justify-center">
                        <button id="btn-rotate" class="control-btn w-12 h-12 bg-slate-700 rounded-full text-cyan-400 shadow-lg flex items-center justify-center text-xl">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                    <div class="col-start-1 row-start-2 flex items-center justify-center">
                        <button id="btn-left" class="control-btn w-12 h-12 bg-slate-700 rounded-full text-white shadow-lg flex items-center justify-center text-xl">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                    </div>
                    <div class="col-start-2 row-start-2 flex items-center justify-center">
                        <button id="btn-down" class="control-btn w-12 h-12 bg-slate-700 rounded-full text-white shadow-lg flex items-center justify-center text-xl">
                            <i class="fas fa-arrow-down"></i>
                        </button>
                    </div>
                    <div class="col-start-3 row-start-2 flex items-center justify-center">
                        <button id="btn-right" class="control-btn w-12 h-12 bg-slate-700 rounded-full text-white shadow-lg flex items-center justify-center text-xl">
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                    <div class="col-start-2 row-start-3 flex items-center justify-center">
                        <button id="btn-drop" class="control-btn w-12 h-12 bg-purple-700 rounded-full text-white shadow-lg flex items-center justify-center text-xl">
                            <i class="fas fa-angle-double-down"></i>
                        </button>
                    </div>
                </div>

                <!-- 功能按钮 -->
                <div class="flex gap-2 mt-4 md:mt-0">
                    <button id="pause-btn" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold transition-colors">
                        <i class="fas fa-pause mr-1"></i> 暂停
                    </button>
                    <button id="reset-btn" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold transition-colors">
                        <i class="fas fa-redo mr-1"></i> 重置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏结束弹窗 -->
    <div id="game-over-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-slate-800 p-8 rounded-2xl border-2 border-red-500 shadow-2xl text-center max-w-sm w-full mx-4 transform transition-all scale-100">
            <div class="mb-4 text-red-500 text-6xl">
                <i class="fas fa-skull-crossbones"></i>
            </div>
            <h2 class="text-3xl font-bold text-white mb-2">GAME OVER</h2>
            <p class="text-slate-400 mb-6">最终得分: <span id="final-score" class="text-cyan-400 font-mono text-xl">0</span></p>
            <button id="restart-game-btn" class="w-full py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white rounded-xl font-bold shadow-lg transition-all btn-hover">
                再玩一次
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
